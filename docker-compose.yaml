services:

  view:
    build:
      context: .
      dockerfile: view/Dockerfile
    secrets:
      - tls_keystore
    environment:
      AUTH_ADDRESS: "172.28.0.11:9090"
      GRADES_ADDRESS: "172.28.0.12:9090"
      COURSES_ADDRESS: "172.28.0.13:9090"
      SERVER_PORT: "8443"
      SERVER_SSL_BUNDLE: web
      SPRING_SSL_BUNDLE_JKS_WEB_KEYSTORE_LOCATION: file:/run/secrets/tls_keystore
      SPRING_SSL_BUNDLE_JKS_WEB_KEYSTORE_TYPE: PKCS12
      SPRING_SSL_BUNDLE_JKS_WEB_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY: "true"
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
    networks:
      frontend:
        ipv4_address: 172.28.0.10
    ports:
      - "3443:8443"

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    secrets:
      - db_password
      - jwt_secret
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.28.1.14:5432,172.28.1.15:5432/appdb?targetServerType=preferPrimary
      SPRING_DATASOURCE_USERNAME: app
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_GRPC_SERVER_PORT: "9090"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "60000"
    networks:
      frontend:
        ipv4_address: 172.28.0.11
      backend:
        ipv4_address: 172.28.1.11
    restart: on-failure
    depends_on:
      db-primary:
        condition: service_started
        required: false
      db-replica:
        condition: service_started
        required: false
    
  grades:
    build:
      context: .
      dockerfile: grades/Dockerfile
    secrets:
      - db_password
      - jwt_secret
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.28.1.14:5432,172.28.1.15:5432/appdb?targetServerType=preferPrimary
      SPRING_DATASOURCE_USERNAME: app
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_GRPC_SERVER_PORT: "9090"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "60000"
    networks:
      frontend:
        ipv4_address: 172.28.0.12
      backend:
        ipv4_address: 172.28.1.12
    restart: on-failure
    depends_on:
      db-primary:
        condition: service_started
        required: false
      db-replica:
        condition: service_started
        required: false

  courses:
    build:
      context: .
      dockerfile: courses/Dockerfile
    secrets:
      - db_password
      - jwt_secret
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.28.1.14:5432,172.28.1.15:5432/appdb?targetServerType=preferPrimary
      SPRING_DATASOURCE_USERNAME: app
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_GRPC_SERVER_PORT: "9090"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "60000"
    networks:
      frontend:
        ipv4_address: 172.28.0.13
      backend:
        ipv4_address: 172.28.1.13
    restart: on-failure
    depends_on:
      db-primary:
        condition: service_started
        required: false
      db-replica:
        condition: service_started
        required: false
  
  clearance:
    build:
      context: .
      dockerfile: clearance/Dockerfile
    secrets:
      - db_password
      - jwt_secret
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.28.1.14:5432,172.28.1.15:5432/appdb?targetServerType=preferPrimary
      SPRING_DATASOURCE_USERNAME: app
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_GRPC_SERVER_PORT: "9090"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "60000"
    networks:
      frontend:
        ipv4_address: 172.28.0.14
      backend:
        ipv4_address: 172.28.1.17
    restart: on-failure
    depends_on:
      db-primary:
        condition: service_started
        required: false
      db-replica:
        condition: service_started
        required: false

  db-primary:
    image: postgres:17
    user: postgres
    restart: on-failure
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGCONNECT_TIMEOUT: "3"
      PEER: "172.28.1.15"
      ALLOW_INIT: "true"
    
    secrets:
      - db_password
      - repl_password
    
    command: ["bash", "/db-start/start.sh"]
        

    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
      - ./db-start/start.sh:/db-start/start.sh:ro

    networks:
      backend:
        ipv4_address: 172.28.1.14

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U app -d appdb"] 
      interval: 10s
      timeout: 5s
      retries: 5
  
  db-replica:
    image: postgres:17
    user: postgres
    restart: on-failure
    environment:
      PGCONNECT_TIMEOUT: "3"
      PEER: "172.28.1.14"
      ALLOW_INIT: "false"
      
    secrets:
      - db_password
      - repl_password

    # No depends_on: start.sh waits for (and retries against) its partner itself.
    command: ["bash", "/db-start/start.sh"]

    
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./db-start/start.sh:/db-start/start.sh:ro

    networks:
      backend:
        ipv4_address: 172.28.1.15

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U app -d appdb"] 
      interval: 10s
      timeout: 5s
      retries: 5

  db-watchdog:
    image: postgres:17
    command: ["bash", "/scripts/watchdog.sh"]
    restart: on-failure
    volumes:
      - ./watchdog:/scripts:ro
    secrets:
      - db_password
    networks:
      backend:
        ipv4_address: 172.28.1.16
    # Must run even when a DB node is down: that's exactly when it's needed.
    depends_on:
      db-primary:
        condition: service_started
        required: false
      db-replica:
        condition: service_started
        required: false


volumes:
  primary-data:
  replica-data:

secrets:
  db_password:
    environment: DB_PASSWORD
  repl_password:
    environment: REPL_PASSWORD
  jwt_secret:
    environment: JWT_SECRET
  tls_keystore:
    file: ./certs/keystore.p12

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    ipam:
      config:
        - subnet: 172.28.1.0/24
