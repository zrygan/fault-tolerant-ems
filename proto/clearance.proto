syntax = "proto3";

package ems.clearance;
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.ems.proto.clearance";

service ClearanceService {
    // create
    rpc PlaceHold (PlaceHoldRequest) returns (PlaceHoldResponse);
    // reads
    rpc ListMyClearances (ListMyClearancesRequest) returns (ListMyClearancesResponse);
    rpc ListStudentClearances (ListStudentClearancesRequest) returns (ListStudentClearancesResponse);
    rpc ListStudentClearancesByHoldType (ListStudentClearancesByHoldTypeRequest) returns (ListStudentClearancesByHoldTypeResponse);
    rpc ListStudentClearancesByPlacedBy (ListStudentClearancesByPlacedByRequest) returns (ListStudentClearancesByPlacedByResponse);
    // update/delete
    rpc ResolveHold (ResolveHoldRequest) returns (ResolveHoldResponse);
}

message ClearanceInfo {
    int64 id = 1;
    int64 student_id = 2;
    string hold_type = 3;
    int64 placed_by = 4;
    string placed_by_name = 5;
    google.protobuf.Timestamp placed_on = 6;
    optional int64 resolved_by = 7;
    optional string resolved_by_name = 8;
    google.protobuf.Timestamp resolved_on = 9;
}

message PlaceHoldRequest {
    int64 student_id = 1;
    string hold_type = 2;
}
 
message PlaceHoldResponse {
    ClearanceInfo clearance = 1;
}

message ListMyClearancesRequest {
    bool unresolved_only = 1;
}
 
message ListMyClearancesResponse {
    repeated ClearanceInfo clearances = 1;
}
 
message ListStudentClearancesRequest {
    int64 student_id = 1;
    bool unresolved_only = 2;
}
 
message ListStudentClearancesResponse {
    repeated ClearanceInfo clearances = 1;
}

message ListStudentClearancesByHoldTypeRequest {
    int64 student_id = 1;
    string hold_type = 2;
}

message ListStudentClearancesByHoldTypeResponse {
    repeated ClearanceInfo clearances = 1;
}

message ListStudentClearancesByPlacedByRequest {
    int64 student_id = 1;
    int64 placed_by = 2;
}

message ListStudentClearancesByPlacedByResponse {
    repeated ClearanceInfo clearances = 1;
}
 
message ResolveHoldRequest {
    int64 clearance_id = 1;
}
 
message ResolveHoldResponse {
    ClearanceInfo clearance = 1;
}