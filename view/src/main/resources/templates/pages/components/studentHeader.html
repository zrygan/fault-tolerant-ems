<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header class="dashboard-header" th:fragment="header">
        <h2 class="site-name">EnrollmentHub</h2>
        
        <div id="header-right">
            <nav class="nav-links">
                <a th:href="@{/student/dashboard}">Home</a>
                <a th:href="@{/student/enroll}">Enroll</a>
                <a th:href="@{/student/grades}">View Grades</a>
            </nav>
            <div class="profile-menu">
                <button class="circle profile-trigger" id="profile" type="button"
                        aria-expanded="false" aria-controls="icon-tooltip"></button>
                <div class="tooltip" id="icon-tooltip" role="dialog" hidden>
                    <div id="tooltip-details">
                        <p th:text="${user?.fullName}">Lastname, Firstname</p>
                        <p th:text="${user?.email}">placeholder@email.com</p>
                    </div>

                    <form th:action="@{/logout}" method="post">
                        <button id="logout-btn" type="submit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                            <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                            </svg>
                            Log out
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </header>
    <script type="module" th:src="@{/main.js}"></script>
</body>
</html>
