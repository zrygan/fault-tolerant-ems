<html>
    <head>
        <meta charset="UTF-8" />
        <title>Enrollment</title>

        <link rel="stylesheet" th:href="@{/style.css}" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header th:replace="~{pages/components/studentHeader :: header}"></header>

        <main class="main-section" id="enroll-main">
            <h3>Enroll in available courses</h3>
            <p th:if="${error}" th:text="${error}"></p>
            <table>
                <thead>
                <tr>
                    <th>Course</th>
                    <th>Section</th>
                    <th>Capacity</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${sections}">
                <td th:text="${s.courseCode}"></td>
                    <td style="padding: 10px;" th:text="${s.id}"></td>
                <td style="text-align: center;" th:text="${s.enrolledCount} + '/' + ${s.capacity}"></td>
                <td>
                <form th:action="@{/student/enroll}" method="post" th:if="${s.isOpen}">
                    <input type="hidden" name="sectionId" th:value="${s.id}">
                    <button style = " padding: 6px 10px;">Enroll</button>
                </form>
                </td>
                </tr>
                </tbody>
            </table>
        </main>
        <script type="module" th:src="@{/main.js}"></script>
    </body>
</html>
