<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>Grade View</title>

        <link rel="stylesheet" th:href="@{/style.css}" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header th:replace="~{pages/components/studentHeader :: header}"></header>
        <main class="main-section" id="grades-main">
            <h3>View your grades</h3>
            <p th:if="${error}" th:text="${error}"></p>
            <div class="table-res">
                <table>
                    <thead>
                        <tr class="grades-table-head">
                            <th>Course Code</th>
                            <th>Course Name</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="grade-view" th:each="g : ${grades}">
                            <td th:text="${g.courseCode}"></td>
                            <td th:text="${g.courseTitle}"></td>
                            <td th:text="${g.hasGrade()} ? ${g.grade} : 'No grade yet'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <script type="module" th:src="@{/main.js}"></script>
    </body>
</html>
