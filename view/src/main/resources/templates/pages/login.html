<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>Log-in</title>

        <link rel="stylesheet" th:href="@{/style.css}" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <main id="log-in">
            <h1>Log-in</h1>
            <form id="log-in-form" th:action="@{/login}" method="POST">
                <div id="input-content">
                    <label for="email">Email:</label>
                    <input type="text" id="email" class="text-box" name="email" placeholder="Enter your email" required>
                </div>

                <div id="input-content">
                    <label for="password">Password:</label>
                    <input id="password" class="text-box" type="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit">Submit</button>
            </form>
            <a id="page-link" href="#">Don't have an account? Sign up instead.</a>
            <p th:if="${error}" th:text="${error}"></p>
        </main>
        <script type="module" th:src="@{/main.js}"></script>
    </body>
</html>
